<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender Kegiatan GA - Bank Mandiri Area Mataram</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{font-family:Poppins,sans-serif}
body{background:#EEF4FB}
.day{
  min-height:120px;
  transition:.2s;
}
.day:hover{
  background:#EFF6FF;
}
.today{
  outline:3px solid #FDB913;
}
</style>

</head>
<body class="p-5">

<div class="max-w-7xl mx-auto">

<!-- HEADER -->
<div class="bg-gradient-to-r from-[#003D79] via-[#005EB8] to-[#FDB913] rounded-[30px] text-white p-8 shadow-xl mb-6">

<div class="text-sm tracking-widest opacity-80 uppercase">
BANK MANDIRI AREA MATARAM
</div>

<h1 class="text-4xl font-bold mt-3 flex items-center gap-3">
📅 Kalender Kegiatan GA
</h1>

<p class="mt-2 opacity-90">
Terhubung otomatis ke Google Sheets.
</p>

</div>

<!-- COUNTDOWN -->
<div class="grid md:grid-cols-3 gap-5 mb-6">

<div class="bg-white rounded-3xl shadow p-5">
<p class="text-sm text-gray-500">Acara Terdekat</p>

<h2 id="nextTitle" class="text-xl font-bold text-[#005EB8] mt-2">
Memuat...
</h2>

<p id="nextInfo" class="text-sm text-gray-500 mt-1"></p>
</div>

<div class="bg-white rounded-3xl shadow p-5 md:col-span-2">
<p class="text-sm text-gray-500 mb-3">Countdown</p>

<div id="countdown" class="grid grid-cols-4 gap-3"></div>

</div>

</div>

<div class="grid lg:grid-cols-[1fr,340px] gap-6">

<!-- KALENDER -->
<div class="bg-white rounded-3xl shadow p-5">

<div class="flex justify-between items-center mb-5">

<button onclick="changeMonth(-1)"
class="border rounded-xl px-3 py-2 hover:bg-gray-100">◀</button>

<h2 id="monthTitle" class="font-bold text-xl text-[#003D79]"></h2>

<button onclick="changeMonth(1)"
class="border rounded-xl px-3 py-2 hover:bg-gray-100">▶</button>

</div>

<div class="grid grid-cols-7 text-center text-xs font-semibold text-gray-500 mb-2">
<div>MIN</div>
<div>SEN</div>
<div>SEL</div>
<div>RAB</div>
<div>KAM</div>
<div>JUM</div>
<div>SAB</div>
</div>

<div id="calendar" class="grid grid-cols-7 gap-2"></div>

</div>

<!-- AGENDA -->
<div class="bg-white rounded-3xl shadow p-5">

<div class="flex justify-between items-center mb-5">

<h2 class="font-bold text-[#003D79] text-lg">
Agenda GA
</h2>

<button onclick="loadEvents()"
class="bg-[#005EB8] text-white px-3 py-2 rounded-xl text-sm">
Refresh
</button>

</div>

<div id="agendaList" class="space-y-3"></div>

</div>

</div>

</div>

<script>

// ================= GOOGLE SHEET =================

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQdvQN9ZBxdy9ter_b0Qr_gGMwAety_w9u1ojbqxZuddB3w5EIzME3jlO9xvfoSdWcv1DmL--rvwWRh/pub?gid=483038837&single=true&output=csv" + Date.now();

// ================================================

const months=[
"Januari","Februari","Maret","April","Mei","Juni",
"Juli","Agustus","September","Oktober","November","Desember"
];

const colors={
"Event":"bg-blue-100 text-blue-700",
"Gedung Kantor":"bg-green-100 text-green-700",
"CSR":"bg-yellow-100 text-yellow-700",
"Donor Darah":"bg-red-100 text-red-700",
"Monitoring":"bg-purple-100 text-purple-700"
};

let events=[];
let currentMonth=new Date();

// ================= LOAD SHEET =================

async function loadEvents(){

document.getElementById("agendaList").innerHTML="Memuat agenda...";

try{

const response=await fetch(SHEET_URL+"?v="+Date.now(),{cache:"no-store"});

const csv=await response.text();

const parsed=Papa.parse(csv,{
header:true,
skipEmptyLines:true
});

events=parsed.data.map(item=>{

let tanggal=item["Tanggal"] || "";

if(tanggal.includes("/")){
const d=new Date(tanggal);
tanggal=d.toISOString().slice(0,16).replace("T"," ");
}

return{

date:tanggal,
title:item["Nama Kegiatan"] || "",
location:item["Lokasi"] || "",
category:item["Kategori"] || "Event",
note:item["Keterangan"] || ""

}

}).filter(e=>e.title!=="" && e.date!=="");

events.sort((a,b)=>new Date(a.date)-new Date(b.date));

renderAgenda();
renderCalendar();
renderCountdown();

}catch(err){

console.error(err);

document.getElementById("agendaList").innerHTML=
"<div class='bg-red-100 text-red-700 rounded-xl p-3'>Gagal membaca Google Sheet.</div>";

}

}

// ================= LIST =================

function renderAgenda(){

const list=document.getElementById("agendaList");

list.innerHTML="";

events.forEach(e=>{

list.innerHTML+=`
<div class="border-l-4 border-[#005EB8] rounded-xl bg-slate-50 p-3">

<div class="font-semibold text-[#003D79]">${e.title}</div>

<div class="text-xs mt-2">📅 ${new Date(e.date).toLocaleString("id-ID")}</div>

<div class="text-xs">📍 ${e.location}</div>

<span class="inline-block mt-2 rounded-full px-2 py-1 text-xs ${colors[e.category] || "bg-gray-100 text-gray-700"}">
${e.category}
</span>

<div class="text-xs mt-2 text-gray-500">
${e.note}
</div>

</div>
`;

});

}

// ================= CALENDAR =================

function renderCalendar(){

const grid=document.getElementById("calendar");

grid.innerHTML="";

const year=currentMonth.getFullYear();

const month=currentMonth.getMonth();

document.getElementById("monthTitle").innerHTML=
months[month]+" "+year;

const first=new Date(year,month,1).getDay();

const total=new Date(year,month+1,0).getDate();

for(let i=0;i<first;i++) grid.innerHTML+="<div></div>";

for(let day=1;day<=total;day++){

const key=year+"-"+String(month+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");

const todayEvents=events.filter(e=>e.date.startsWith(key));

const now=new Date();

const isToday=
now.getFullYear()==year &&
now.getMonth()==month &&
now.getDate()==day;

let html=`
<div class="day rounded-xl border bg-white p-2 ${isToday?'today':''}">

<div class="font-bold text-sm">${day}</div>`;

todayEvents.forEach(ev=>{

html+=`
<div class="mt-1 rounded px-1 py-[2px] text-[10px] ${colors[ev.category] || "bg-blue-100 text-blue-700"}">

${ev.title}

</div>`;

});

html+="</div>";

grid.innerHTML+=html;

}

}

function changeMonth(step){

currentMonth.setMonth(currentMonth.getMonth()+step);

renderCalendar();

}

// ================= COUNTDOWN =================

function renderCountdown(){

const next=events.find(e=>new Date(e.date)>new Date());

if(!next){

document.getElementById("nextTitle").innerHTML="Tidak ada agenda.";

document.getElementById("nextInfo").innerHTML="";

return;

}

document.getElementById("nextTitle").innerHTML=next.title;

document.getElementById("nextInfo").innerHTML=
new Date(next.date).toLocaleString("id-ID")+" • "+next.location;

function update(){

const diff=new Date(next.date)-new Date();

const vals=[
Math.max(0,Math.floor(diff/86400000)),
Math.max(0,Math.floor(diff%86400000/3600000)),
Math.max(0,Math.floor(diff%3600000/60000)),
Math.max(0,Math.floor(diff%60000/1000))
];

const label=["Hari","Jam","Menit","Detik"];

document.getElementById("countdown").innerHTML=
vals.map((v,i)=>`
<div class="bg-blue-50 rounded-xl text-center p-3">

<div class="text-3xl font-bold text-[#005EB8]">${v}</div>

<div class="text-xs text-gray-500">${label[i]}</div>

</div>`).join("");

}

update();

setInterval(update,1000);

}

// ================= START =================

loadEvents();

</script>

</body>
</html>
