<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender Kegiatan GA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Poppins',sans-serif}
body{background:#EEF4FB}
.day{min-height:110px;border:1px solid #E5E7EB;border-radius:14px;padding:8px;background:#fff}
.today{outline:3px solid #FDB913}
</style>
</head>
<body class="p-5">
<div class="max-w-7xl mx-auto">
<div class="bg-gradient-to-r from-[#003D79] via-[#005EB8] to-[#FDB913] text-white rounded-[28px] p-8 shadow-xl mb-6">
<p class="uppercase text-sm opacity-80">BANK MANDIRI AREA MATARAM</p>
<h1 class="text-4xl font-bold mt-3">📅 Kalender Kegiatan GA</h1>
<p class="mt-2 opacity-90">Sinkron otomatis dengan Google Sheets.</p>
</div>

<div class="grid md:grid-cols-3 gap-5 mb-6">
<div class="bg-white rounded-3xl p-5 shadow">
<p class="text-sm text-gray-500">Acara Terdekat</p>
<h2 id="nextTitle" class="text-xl font-bold text-[#005EB8] mt-2">Memuat...</h2>
<p id="nextInfo" class="text-sm text-gray-500"></p>
</div>

<div class="bg-white rounded-3xl p-5 shadow md:col-span-2">
<p class="text-sm text-gray-500">Countdown</p>
<div id="countdown" class="grid grid-cols-4 gap-3 mt-4"></div>
</div>
</div>

<div class="grid lg:grid-cols-[1fr,340px] gap-6">
<div class="bg-white rounded-3xl p-5 shadow">
<div class="flex justify-between items-center mb-4">
<button onclick="changeMonth(-1)" class="border rounded-lg px-3 py-2">◀</button>
<h2 id="monthTitle" class="font-bold text-xl text-[#003D79]"></h2>
<button onclick="changeMonth(1)" class="border rounded-lg px-3 py-2">▶</button>
</div>

<div class="grid grid-cols-7 text-center text-xs font-semibold text-gray-500 mb-2">
<div>MIN</div><div>SEN</div><div>SEL</div><div>RAB</div><div>KAM</div><div>JUM</div><div>SAB</div>
</div>

<div id="calendar" class="grid grid-cols-7 gap-2"></div>
</div>

<div class="bg-white rounded-3xl p-5 shadow">
<div class="flex justify-between items-center mb-4">
<h2 class="font-bold text-[#003D79] text-lg">Agenda GA</h2>
<button onclick="loadEvents()" class="bg-[#005EB8] text-white px-3 py-2 rounded-lg text-sm">Refresh</button>
</div>
<div id="agendaList" class="space-y-3"></div>
</div>
</div>
</div>

<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQdvQN9ZBxdy9ter_b0Qr_gGMwAety_w9u1ojbqxZuddB3w5EIzME3jlO9xvfoSdWcv1DmL--rvwWRh/pub?gid=483038837&single=true&output=csv" + Date.now();
const MONTHS=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const COLORS={"Event":"bg-blue-100 text-blue-700","Gedung Kantor":"bg-green-100 text-green-700","Monitoring":"bg-purple-100 text-purple-700"};
let events=[], current=new Date();

async function loadEvents(){
 document.getElementById("agendaList").innerHTML="Memuat agenda...";
 try{
  const csv=await fetch(SHEET_URL+"&t="+Date.now(),{cache:"no-store"}).then(r=>r.text());
  const parsed=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.replace(/^\uFEFF/,'').trim()});
  events=parsed.data.map(r=>({date:new Date(r["Tanggal"]),title:r["Nama Kegiatan"],location:r["Lokasi"],category:r["Kategori"]||"Event",note:r["Keterangan"]||""})).filter(e=>e.title&&!isNaN(e.date));
  events.sort((a,b)=>a.date-b.date);
  renderAgenda();renderCalendar();renderCountdown();
 }catch(e){console.error(e);document.getElementById("agendaList").innerHTML="<div class='text-red-600'>Gagal membaca Google Sheet.</div>";}
}
function renderAgenda(){const box=document.getElementById("agendaList");box.innerHTML="";events.forEach(e=>box.innerHTML+=`<div class='border-l-4 border-blue-700 bg-slate-50 rounded-xl p-3'><div class='font-semibold text-blue-900'>${e.title}</div><div class='text-xs mt-2'>📅 ${e.date.toLocaleString('id-ID')}</div><div class='text-xs'>📍 ${e.location}</div><div class='inline-block mt-2 px-2 py-1 rounded-full text-xs ${COLORS[e.category]||"bg-gray-100 text-gray-700"}'>${e.category}</div><div class='text-xs mt-2 text-gray-500'>${e.note}</div></div>`);}
function renderCalendar(){const cal=document.getElementById("calendar");cal.innerHTML="";const y=current.getFullYear(),m=current.getMonth();document.getElementById("monthTitle").textContent=MONTHS[m]+" "+y;const first=new Date(y,m,1).getDay(),total=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)cal.innerHTML+="<div></div>";for(let d=1;d<=total;d++){const evs=events.filter(e=>e.date.getFullYear()==y&&e.date.getMonth()==m&&e.date.getDate()==d);const t=new Date();const cls=t.getFullYear()==y&&t.getMonth()==m&&t.getDate()==d?"today":"";let html=`<div class='day ${cls}'><div class='font-bold text-sm'>${d}</div>`;evs.forEach(ev=>html+=`<div class='mt-1 rounded px-1 text-[10px] ${COLORS[ev.category]||"bg-blue-100 text-blue-700"}'>${ev.title}</div>`);html+="</div>";cal.innerHTML+=html;}}
function renderCountdown(){const next=events.find(e=>e.date>new Date());if(!next){document.getElementById("nextTitle").textContent="Tidak ada agenda.";document.getElementById("countdown").innerHTML="";return;}document.getElementById("nextTitle").textContent=next.title;document.getElementById("nextInfo").textContent=next.date.toLocaleString("id-ID")+" • "+next.location;function tick(){const diff=next.date-new Date();const vals=[Math.max(0,Math.floor(diff/86400000)),Math.max(0,Math.floor(diff%86400000/3600000)),Math.max(0,Math.floor(diff%3600000/60000)),Math.max(0,Math.floor(diff%60000/1000))];const labels=["Hari","Jam","Menit","Detik"];document.getElementById("countdown").innerHTML=vals.map((v,i)=>`<div class='bg-blue-50 rounded-xl p-3 text-center'><div class='text-3xl font-bold text-blue-700'>${v}</div><div class='text-xs text-gray-500'>${labels[i]}</div></div>`).join("");}tick();setInterval(tick,1000);}
function changeMonth(step){current.setMonth(current.getMonth()+step);renderCalendar();}
loadEvents();
</script>
</body>
</html>
