<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender GA - Bank Mandiri Area Mataram</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#eef4fb}
.day{min-height:110px}
.today{outline:3px solid #FDB913}
</style>
</head>
<body class="p-5">
<div class="max-w-7xl mx-auto">
<div class="rounded-[28px] p-8 text-white mb-6 bg-gradient-to-r from-[#003D79] via-[#005EB8] to-[#FDB913]">
<p class="uppercase text-sm opacity-80">BANK MANDIRI AREA MATARAM</p>
<h1 class="text-4xl font-bold mt-2">📅 Kalender Kegiatan GA</h1>
<p>Terhubung langsung ke Google Sheets.</p>
</div>

<div class="grid md:grid-cols-3 gap-4 mb-6">
<div class="bg-white rounded-2xl p-5 shadow">
<p class="text-gray-500 text-sm">Acara Terdekat</p>
<h2 id="nextTitle" class="text-xl font-bold text-[#005EB8] mt-2">Memuat...</h2>
<p id="nextInfo" class="text-sm text-gray-500"></p>
</div>
<div class="bg-white rounded-2xl p-5 shadow md:col-span-2">
<p class="text-gray-500 text-sm">Countdown</p>
<div id="countdown" class="grid grid-cols-4 gap-3 mt-3"></div>
</div>
</div>

<div class="grid lg:grid-cols-[1fr,340px] gap-6">
<div class="bg-white rounded-3xl p-5 shadow">
<div class="flex justify-between items-center mb-4">
<button onclick="changeMonth(-1)" class="border rounded-lg px-3 py-2">◀</button>
<h2 id="monthTitle" class="font-bold text-xl text-[#003D79]"></h2>
<button onclick="changeMonth(1)" class="border rounded-lg px-3 py-2">▶</button>
</div>

<div class="grid grid-cols-7 text-center text-xs font-semibold text-gray-500 mb-2">
<div>MIN</div><div>SEN</div><div>SEL</div><div>RAB</div><div>KAM</div><div>JUM</div><div>SAB</div>
</div>
<div id="calendar" class="grid grid-cols-7 gap-2"></div>
</div>

<div class="bg-white rounded-3xl p-5 shadow">
<div class="flex justify-between items-center mb-4">
<h2 class="font-bold text-[#003D79] text-lg">Agenda GA</h2>
<button onclick="loadEvents()" class="bg-[#005EB8] text-white px-3 py-2 rounded-lg text-sm">Refresh</button>
</div>
<div id="agendaList" class="space-y-3 text-sm">Memuat agenda...</div>
</div>
</div>
</div>

<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQdvQN9ZBxdy9ter_b0Qr_gGMwAety_w9u1ojbqxZuddB3w5EIzME3jlO9xvfoSdWcv1DmL--rvwWRh/pub?gid=483038837&single=true&output=csv";

const months=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const colors={"Donor Darah":"bg-red-100 text-red-700","CSR":"bg-green-100 text-green-700","Rapat":"bg-blue-100 text-blue-700","Monitoring":"bg-purple-100 text-purple-700","BAST":"bg-cyan-100 text-cyan-700","Sembako":"bg-yellow-100 text-yellow-700"};
let events=[]; let current=new Date();

async function loadEvents(){
 document.getElementById("agendaList").innerHTML="Memuat agenda...";
 try{
   const csv=await fetch(SHEET_URL+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.text());
   const parsed=Papa.parse(csv,{header:true,skipEmptyLines:true});
   events=parsed.data.map(r=>({
      date:r["Tanggal"],
      title:r["Nama Kegiatan"],
      pic:r["PIC"],
      location:r["Lokasi"],
      category:r["Kategori"]||"Lainnya",
      note:r["Keterangan"]||""
   })).filter(e=>e.title);
   events.sort((a,b)=>new Date(a.date)-new Date(b.date));
   renderAgenda(); renderCalendar(); renderCountdown();
 }catch(e){
   document.getElementById("agendaList").innerHTML="<div class='bg-red-100 text-red-700 rounded-xl p-3'>Gagal membaca Google Sheet.</div>";
   console.error(e);
 }
}

function renderAgenda(){
 const box=document.getElementById("agendaList");
 box.innerHTML="";
 events.forEach(e=>{
   box.innerHTML+=`<div class='border-l-4 border-[#005EB8] rounded-xl bg-slate-50 p-3'>
   <div class='font-semibold text-[#003D79]'>${e.title}</div>
   <div class='text-xs mt-2'>📅 ${new Date(e.date).toLocaleString("id-ID")}</div>
   <div class='text-xs'>👤 ${e.pic}</div>
   <div class='text-xs'>📍 ${e.location}</div>
   <span class='inline-block mt-2 px-2 py-1 rounded-full text-xs ${colors[e.category]||"bg-gray-100 text-gray-700"}'>${e.category}</span>
   </div>`;
 });
}

function renderCalendar(){
 const cal=document.getElementById("calendar");
 cal.innerHTML="";
 const y=current.getFullYear(),m=current.getMonth();
 document.getElementById("monthTitle").innerText=months[m]+" "+y;
 const first=new Date(y,m,1).getDay();
 const total=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++) cal.innerHTML+="<div></div>";
 for(let d=1;d<=total;d++){
   const key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
   const evs=events.filter(e=>e.date.startsWith(key));
   const t=new Date();
   const today=t.getFullYear()==y&&t.getMonth()==m&&t.getDate()==d;
   let html=`<div class='day rounded-xl border p-2 bg-white ${today?"today":""}'><div class='font-bold text-sm'>${d}</div>`;
   evs.forEach(ev=>html+=`<div class='mt-1 rounded px-1 text-[10px] ${colors[ev.category]||"bg-gray-100"}'>${ev.title}</div>`);
   html+="</div>";
   cal.innerHTML+=html;
 }
}

function renderCountdown(){
 const next=events.find(e=>new Date(e.date)>new Date());
 if(!next){document.getElementById("nextTitle").innerText="Tidak ada agenda.";return;}
 document.getElementById("nextTitle").innerText=next.title;
 document.getElementById("nextInfo").innerText=new Date(next.date).toLocaleString("id-ID")+" • "+next.location;
 function tick(){
   const diff=new Date(next.date)-new Date();
   const vals=[Math.max(0,Math.floor(diff/86400000)),Math.max(0,Math.floor(diff%86400000/3600000)),Math.max(0,Math.floor(diff%3600000/60000)),Math.max(0,Math.floor(diff%60000/1000))];
   const labels=["Hari","Jam","Menit","Detik"];
   document.getElementById("countdown").innerHTML=vals.map((v,i)=>`<div class='bg-blue-50 rounded-xl p-3 text-center'><div class='text-3xl font-bold text-[#005EB8]'>${v}</div><div class='text-xs text-gray-500'>${labels[i]}</div></div>`).join("");
 }
 tick(); setInterval(tick,1000);
}

function changeMonth(step){current.setMonth(current.getMonth()+step);renderCalendar();}
loadEvents();
</script>
</body>
</html>
