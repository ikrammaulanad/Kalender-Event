<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender Kegiatan GA - Bank Mandiri Area Mataram</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Inter,Arial,sans-serif;background:#eef3fb}
.calendar-day{min-height:110px}
</style>
</head>
<body>

<div class="max-w-7xl mx-auto p-5">

  <div class="bg-gradient-to-r from-blue-900 via-blue-700 to-yellow-500 rounded-3xl p-8 text-white shadow-xl mb-6">
    <p class="text-sm opacity-80">BANK MANDIRI AREA MATARAM</p>
    <h1 class="text-4xl font-bold mt-2">📅 Kalender Kegiatan GA</h1>
    <p class="mt-2 opacity-90">Terhubung langsung ke Google Sheets.</p>
  </div>

  <div class="grid md:grid-cols-3 gap-5 mb-6">

    <div class="bg-white rounded-2xl p-5 shadow">
      <p class="text-sm text-gray-500">Acara Terdekat</p>
      <h2 id="nextTitle" class="text-xl font-bold text-blue-800 mt-2">Memuat...</h2>
      <p id="nextInfo" class="text-gray-500 text-sm"></p>
    </div>

    <div class="bg-white rounded-2xl p-5 shadow md:col-span-2">
      <p class="text-sm text-gray-500">Countdown</p>
      <div id="countdown" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4"></div>
    </div>

  </div>

  <div class="grid lg:grid-cols-[1fr,340px] gap-6">

    <div class="bg-white rounded-3xl p-5 shadow">

      <div class="flex justify-between items-center mb-4">
        <button onclick="changeMonth(-1)" class="border rounded-lg px-3 py-2 hover:bg-slate-100">◀</button>
        <h2 id="monthTitle" class="font-bold text-xl text-blue-800"></h2>
        <button onclick="changeMonth(1)" class="border rounded-lg px-3 py-2 hover:bg-slate-100">▶</button>
      </div>

      <div class="grid grid-cols-7 text-center font-semibold text-xs text-gray-500 mb-2">
        <div>MIN</div>
        <div>SEN</div>
        <div>SEL</div>
        <div>RAB</div>
        <div>KAM</div>
        <div>JUM</div>
        <div>SAB</div>
      </div>

      <div id="calendar" class="grid grid-cols-7 gap-2"></div>

    </div>

    <div class="bg-white rounded-3xl p-5 shadow">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-blue-800">Agenda GA</h3>
        <button onclick="loadEvents()" class="text-sm bg-blue-700 text-white px-3 py-1 rounded-lg hover:bg-blue-800">Refresh</button>
      </div>

      <div id="agendaList" class="space-y-3 text-sm"></div>
    </div>

  </div>

</div>

<script>

const SHEET_ID="2PACX-1vQdvQN9ZBxdy9ter_b0Qr_gGMwAety_w9u1ojbqxZuddB3w5EIzME3jlO9xvfoSdWcv1DmL--rvwWRh";

const SHEET_NAME="Agenda GA";

const sheetURL=`https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=483038837&single=true&output=csv&t=${Date.now()}`;

let events=[];
let current=new Date();

const monthNames=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

const categoryColor={
  "Donor Darah":"bg-red-100 text-red-700",
  "CSR":"bg-green-100 text-green-700",
  "Rapat":"bg-blue-100 text-blue-700",
  "Monitoring":"bg-purple-100 text-purple-700",
  "Sembako":"bg-yellow-100 text-yellow-700",
  "BAST":"bg-cyan-100 text-cyan-700",
  "Kunjungan":"bg-orange-100 text-orange-700",
  "Lainnya":"bg-gray-100 text-gray-700"
};

function parseCSV(text){

  const rows=[];
  let row=[];
  let current="";
  let insideQuote=false;

  for(let i=0;i<text.length;i++){
    const c=text[i];

    if(c==='"'){
      insideQuote=!insideQuote;
      continue;
    }

    if(c===',' && !insideQuote){
      row.push(current);
      current="";
      continue;
    }

    if((c==='\n' || c==='\r') && !insideQuote){
      if(current!=="" || row.length){
        row.push(current);
        rows.push(row);
      }
      row=[];
      current="";
      continue;
    }

    current+=c;
  }

  if(current!=="" || row.length){
    row.push(current);
    rows.push(row);
  }

  return rows;
}

async function loadEvents(){

  document.getElementById("agendaList").innerHTML="Memuat agenda...";

  try{{

    const csv=await fetch(sheetURL,{cache:"no-store"}).then(r=>r.text());

    const rows=parseCSV(csv);

    rows.shift();

    events=rows.map(r=>({
      date:r[0]||"",
      title:r[1]||"",
      pic:r[2]||"",
      location:r[3]||"",
      category:r[4]||"Lainnya",
      note:r[5]||""
    })).filter(e=>e.title!="");

    events.sort((a,b)=>new Date(a.date)-new Date(b.date));

    renderAgenda();
    renderCalendar();
    renderCountdown();

  }catch(err){

    document.getElementById("agendaList").innerHTML=`
      <div class='bg-red-100 text-red-700 p-3 rounded-xl'>
      ❌ Tidak bisa membaca Google Sheet.<br><br>
      Pastikan Google Sheet sudah <b>Publish to Web (CSV)</b>.
      </div>`;

    console.error(err);
  }
}

function renderAgenda(){

  const list=document.getElementById("agendaList");
  list.innerHTML="";

  events.forEach(e=>{

    list.innerHTML+=`
    <div class='border-l-4 border-blue-700 bg-slate-50 rounded-xl p-3'>
      <div class='font-bold text-blue-800'>${e.title}</div>

      <div class='text-xs mt-2'>📅 ${new Date(e.date).toLocaleString('id-ID')}</div>
      <div class='text-xs'>👤 PIC : ${e.pic}</div>
      <div class='text-xs'>📍 ${e.location}</div>

      <span class='inline-block mt-2 px-2 py-1 rounded-full text-xs ${categoryColor[e.category]||categoryColor.Lainnya}'>
        ${e.category}
      </span>
    </div>`;

  });
}

function renderCalendar(){

  const calendar=document.getElementById("calendar");
  calendar.innerHTML="";

  const year=current.getFullYear();
  const month=current.getMonth();

  document.getElementById("monthTitle").innerText=`${monthNames[month]} ${year}`;

  const firstDay=new Date(year,month,1).getDay();
  const totalDays=new Date(year,month+1,0).getDate();

  for(let i=0;i<firstDay;i++) calendar.innerHTML+="<div></div>";

  for(let d=1;d<=totalDays;d++){

    const key=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    const todayEvents=events.filter(e=>e.date.startsWith(key));

    let html=`
    <div class='calendar-day rounded-xl border bg-white p-2'>
      <div class='font-bold text-sm'>${d}</div>`;

    todayEvents.forEach(ev=>{
      html+=`<div class='mt-1 rounded px-1 text-[10px] ${categoryColor[ev.category]||categoryColor.Lainnya}'>${ev.title}</div>`;
    });

    html+="</div>";

    calendar.innerHTML+=html;
  }
}

function changeMonth(step){
  current.setMonth(current.getMonth()+step);
  renderCalendar();
}

function renderCountdown(){

  const next=events.find(e=>new Date(e.date)>new Date());

  if(!next){
    document.getElementById("nextTitle").innerText="Tidak ada agenda mendatang";
    return;
  }

  document.getElementById("nextTitle").innerText=next.title;
  document.getElementById("nextInfo").innerText=`${new Date(next.date).toLocaleString("id-ID")} • ${next.location}`;

  function tick(){

    const diff=new Date(next.date)-new Date();

    const values=[
      Math.max(0,Math.floor(diff/86400000)),
      Math.max(0,Math.floor(diff%86400000/3600000)),
      Math.max(0,Math.floor(diff%3600000/60000)),
      Math.max(0,Math.floor(diff%60000/1000))
    ];

    const labels=["Hari","Jam","Menit","Detik"];

    document.getElementById("countdown").innerHTML=
      values.map((v,i)=>`
        <div class='bg-blue-50 rounded-xl text-center p-3'>
          <div class='text-3xl font-bold text-blue-700'>${v}</div>
          <div class='text-xs text-gray-500'>${labels[i]}</div>
        </div>`).join("");
  }

  tick();
  setInterval(tick,1000);
}

loadEvents();

</script>

</body>
</html>
